<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECHOID — Login</title>
  <link rel="preconnect" href="https://d8j0ntlcm91z4.cloudfront.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --text-dim: rgba(255,255,255,0.62);
      --text-dimmer: rgba(255,255,255,0.42);
      --line: rgba(255,255,255,0.14);
      --line-strong: rgba(255,255,255,0.26);
      --fill-ghost: rgba(255,255,255,0.05);
      --fill-solid: rgba(255,255,255,0.10);
      --gutter: clamp(20px, 5vw, 100px);
      --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
      --font-display: "Sora", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 640px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      isolation: isolate;
    }

    .hero__media {
      position: absolute;
      inset: 0;
      z-index: -1;
      background-color: #000;
    }

    .hero__media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero__scrim {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    @media (min-width:721px) {
      .hero__scrim {
        background:
          linear-gradient(to right, transparent 0%, transparent 45%, rgba(0,0,0,0.45) 72%, rgba(0,0,0,0.72) 100%),
          linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 22%, transparent 78%, rgba(0,0,0,0.65) 100%);
      }
    }
    @media (max-width:720px) {
      .hero__scrim {
        background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.25) 30%, rgba(0,0,0,0.75) 100%);
      }
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 32px;
      padding: clamp(20px, 2.4vw, 34px) var(--gutter);
      z-index: 60;
      position: relative;
    }

    .logo {
      font-family: var(--font-display);
      font-weight: 200;
      font-size: clamp(20px, 1.75vw, 30px);
      letter-spacing: 0.16em;
      color: var(--text);
      text-decoration: none;
      line-height: 1;
    }

    .nav__cluster {
      display: flex;
      align-items: center;
      gap: clamp(24px, 3.2vw, 62px);
    }

    .nav__links {
      display: flex;
      gap: clamp(20px, 2.8vw, 56px);
    }

    .nav__links a {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: clamp(11px, 0.78vw, 14px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      transition: color 0.25s ease;
    }
    .nav__links a:hover {
      color: var(--text-dim);
    }

    .nav__cta {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: clamp(11px, 0.78vw, 14px);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text);
      text-decoration: none;
      padding: clamp(12px,1vw,17px) clamp(20px,1.8vw,32px);
      border: 1px solid var(--line-strong);
      transition: background 0.25s ease, border-color 0.25s ease;
    }
    .nav__cta:hover {
      background-color: var(--fill-ghost);
      border-color: rgba(255,255,255,0.5);
    }

    .hamburger {
      display: none;
      width: 44px;
      height: 44px;
      position: relative;
      cursor: pointer;
      background: transparent;
      border: none;
    }
    .hamburger__bar {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 1px;
      background-color: var(--text);
      transition: transform 0.45s var(--ease-premium), opacity 0.25s ease;
    }
    .hamburger__bar:nth-child(1) { top:16px; }
    .hamburger__bar:nth-child(2) { top:22px; }
    .hamburger__bar:nth-child(3) { top:28px; }

    .hamburger.active .hamburger__bar:nth-child(1) {
      transform: translateX(-50%) rotate(45deg);
      top:22px;
    }
    .hamburger.active .hamburger__bar:nth-child(2) {
      opacity:0;
      transform: translateX(-50%) scaleX(0);
    }
    .hamburger.active .hamburger__bar:nth-child(3) {
      transform: translateX(-50%) rotate(-45deg);
      top:22px;
    }

    @media (max-width:900px) {
      .nav__cluster { display:none; }
      .hamburger { display:block; }
    }

    .mobile-menu {
      position: fixed;
      inset:0;
      z-index:50;
      background: rgba(4,4,6,0.94);
      backdrop-filter: blur(28px) saturate(140%);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:32px;
      clip-path: circle(3% at calc(100% - 42px) 42px);
      opacity:0;
      pointer-events:none;
      transition: clip-path 0.7s var(--ease-premium), opacity 0.45s ease;
    }
    .mobile-menu.open {
      clip-path: circle(150% at calc(100% - 42px) 42px);
      opacity:1;
      pointer-events:auto;
    }
    .mobile-menu__item {
      font-family:var(--font-mono);
      font-weight:400;
      font-size:clamp(20px,5.5vw,28px);
      letter-spacing:0.14em;
      text-transform:uppercase;
      color:var(--text);
      text-decoration:none;
      opacity:0;
      transform:translateY(16px);
      transition:opacity 0.4s ease, transform 0.5s var(--ease-premium);
    }
    .mobile-menu.open .mobile-menu__item {
      opacity:1;
      transform:translateY(0);
    }
    .mobile-menu__cta {
      font-family:var(--font-mono);
      font-weight:400;
      letter-spacing:0.22em;
      text-transform:uppercase;
      color:var(--text);
      text-decoration:none;
      padding:16px 40px;
      border:1px solid var(--line-strong);
      opacity:0;
      transform:translateY(16px);
      transition:opacity 0.4s ease, transform 0.5s var(--ease-premium);
    }
    .mobile-menu.open .mobile-menu__cta {
      opacity:1;
      transform:translateY(0);
    }

    .hero__body {
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding-inline:var(--gutter);
      min-height:0;
      overflow-y:auto;
    }
    @media (max-width:720px) {
      .hero__body { justify-content:center; }
    }

    .panel {
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      width: min(34vw,620px);
      min-width:380px;
    }
    @media (max-width:1100px) {
      .panel { width: min(70vw,520px); min-width:0; }
    }
    @media (max-width:720px) {
      .panel { width:100%; }
    }

    .chip {
      font-family:var(--font-mono);
      font-weight:400;
      font-size:clamp(11px,0.72vw,14px);
      letter-spacing:0.2em;
      text-transform:uppercase;
      background:rgba(255,255,255,0.09);
      padding:clamp(9px,0.8vw,14px) clamp(14px,1.1vw,20px);
      line-height:1;
    }

    .panel h1 {
      font-family:var(--font-display);
      font-weight:200;
      font-size:clamp(54px,6.2vw,118px);
      letter-spacing:0.03em;
      line-height:0.95;
      margin-top:clamp(28px,3vw,52px);
    }
    @media (max-width:380px) {
      .panel h1 { font-size:clamp(44px,15vw,64px); }
    }

    .tagline {
      font-family:var(--font-mono);
      font-weight:300;
      text-transform:uppercase;
      font-size:clamp(11px,0.94vw,17px);
      letter-spacing:0.14em;
      color:var(--text-dim);
      margin-top:clamp(14px,1.4vw,24px);
      line-height:1.4;
    }

    .signup-form {
      margin-top:clamp(38px,4.6vw,82px);
      display:flex;
      flex-direction:column;
      gap:clamp(14px,1.3vw,22px);
      width:100%;
    }

    .visually-hidden {
      position:absolute;
      width:1px;
      height:1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
    }

    .email-input {
      background:transparent;
      border:none;
      border-bottom:1px solid var(--line-strong);
      border-radius:0;
      padding:0 2px clamp(12px,1.1vw,18px);
      font-family:var(--font-display);
      font-weight:300;
      font-size:clamp(16px,0.95vw,18px);
      color:var(--text);
      transition:border-color 0.25s ease;
    }
    .email-input::placeholder { color:var(--text-dim); }
    .email-input:focus {
      outline:none;
      border-color:rgba(255,255,255,0.85);
    }
    .email-input:focus::placeholder { color:var(--text-dimmer); }

    .btn--ghost {
      width:100%;
      border-radius:0;
      border:none;
      padding:clamp(17px,1.6vw,27px) 20px;
      font-family:var(--font-mono);
      font-weight:400;
      text-transform:uppercase;
      letter-spacing:0.22em;
      font-size:clamp(11px,0.78vw,14px);
      background:var(--fill-ghost);
      color:var(--text-dimmer);
      transition:background 0.25s ease, color 0.25s ease;
      cursor:pointer;
    }
    .btn--ghost:hover {
      background:rgba(255,255,255,0.09);
      color:var(--text);
    }

    .btn--solid {
      width:100%;
      border-radius:0;
      border:none;
      padding:clamp(17px,1.6vw,27px) 20px;
      font-family:var(--font-mono);
      font-weight:400;
      text-transform:uppercase;
      letter-spacing:0.22em;
      font-size:clamp(11px,0.78vw,14px);
      background:var(--fill-solid);
      color:var(--text);
      transition:background 0.25s ease;
      cursor:pointer;
    }
    .btn--solid:hover {
      background:rgba(255,255,255,0.17);
    }

    .referral-link {
      align-self:center;
      margin-top:clamp(26px,2.6vw,46px);
      font-family:var(--font-mono);
      font-weight:400;
      text-transform:uppercase;
      font-size:clamp(11px,0.74vw,14px);
      letter-spacing:0.18em;
      color:var(--text);
      text-decoration:underline;
      text-underline-offset:4px;
      transition:color 0.25s ease;
    }
    .referral-link:hover { color:var(--text-dim); }

    .legal-footer {
      border-top:1px solid var(--line);
      padding:clamp(18px,1.7vw,30px) var(--gutter);
      text-align:center;
    }
    .legal-footer p {
      font-family:var(--font-display);
      font-weight:300;
      font-size:clamp(12px,0.82vw,16px);
      color:var(--text-dim);
      line-height:1.5;
    }
    .legal-footer a {
      color:var(--text);
      text-decoration:underline;
      text-underline-offset:3px;
      text-decoration-thickness:1px;
      transition:color 0.25s ease;
    }
    .legal-footer a:hover { color:var(--text-dim); }

    :focus-visible {
      outline:1px solid rgba(255,255,255,0.7);
      outline-offset:3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero__media video { display:none; }
      .hero__media {
        background-image:url("https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_132328_5f9029c8-218f-4489-82b6-29ff2849920e.png");
        background-size:cover;
        background-position:center;
      }
      *, *::before, *::after {
        animation-duration:0.01ms !important;
        transition-duration:0.01ms !important;
      }
    }

    @media (max-height:640px) {
      .navbar { padding:12px var(--gutter); }
      .panel h1 { font-size:clamp(36px,7vw,64px); }
      .signup-form { margin-top:24px; gap:10px; }
      .btn--ghost,.btn--solid { padding:12px 20px; }
      .legal-footer p { font-size:11px; }
      .mobile-menu { gap:20px; }
    }

    body.menu-open { overflow:hidden; }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero__media">
      <video
        autoplay
        muted
        loop
        playsInline
        preload="auto"
        poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_132328_5f9029c8-218f-4489-82b6-29ff2849920e.png"
      >
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260806_133255_956f653f-5d80-4b06-abd5-0f46c98b60fa.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="hero__scrim"></div>

    <nav class="navbar">
      <a href="#" class="logo">ECHOID</a>
      <div class="nav__cluster">
        <div class="nav__links">
          <a href="#story">Story</a>
          <a href="#platforms">Platforms</a>
          <a href="#identity">Identity</a>
          <a href="#contact">Contact</a>
        </div>
        <a href="#join" class="nav__cta">Join up</a>
      </div>
      <button class="hamburger" aria-expanded="false" aria-controls="mobileMenu" aria-label="Open menu">
        <span class="hamburger__bar"></span>
        <span class="hamburger__bar"></span>
        <span class="hamburger__bar"></span>
      </button>
    </nav>

    <div id="mobileMenu" class="mobile-menu" role="dialog" aria-modal="true" aria-label="Site menu" aria-hidden="true" inert>
      <a href="#story" class="mobile-menu__item" style="--i:0">Story</a>
      <a href="#platforms" class="mobile-menu__item" style="--i:1">Platforms</a>
      <a href="#identity" class="mobile-menu__item" style="--i:2">Identity</a>
      <a href="#contact" class="mobile-menu__item" style="--i:3">Contact</a>
      <a href="#join" class="mobile-menu__cta" style="--i:4">Join up</a>
    </div>

    <div class="hero__body">
      <div class="panel">
        <div class="chip">[ VOICE ENTRY ]</div>
        <h1>ECHOID</h1>
        <p class="tagline">Your voice ID to the E network.</p>
        <form class="signup-form" id="loginForm" action="#" method="post" novalidate>
          <label for="email" class="visually-hidden">Email</label>
          <input id="email" class="email-input" type="email" placeholder="Email" />
          <button type="submit" class="btn--ghost">Proceed using email</button>
          <button type="button" class="btn--solid" id="loginBtn">Access</button>
        </form>
        <a href="#invite" class="referral-link">I've got an invite key</a>
      </div>
    </div>

    <footer class="legal-footer">
      <p>Opening an e.xyz account signals that you accept our <a href="#privacy-notice">Privacy Notice</a> and <a href="#service-contract">Service Contract</a>.</p>
    </footer>
  </section>

  <script>
    const hamburger = document.querySelector('.hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    const body = document.body;
    const menuItems = mobileMenu.querySelectorAll('.mobile-menu__item, .mobile-menu__cta');

    function toggleMenu() {
      const isOpen = hamburger.classList.contains('active');
      hamburger.classList.toggle('active');
      mobileMenu.classList.toggle('open');
      body.classList.toggle('menu-open');
      hamburger.setAttribute('aria-expanded', !isOpen);
      mobileMenu.setAttribute('aria-hidden', isOpen);
      if(!isOpen) {
        mobileMenu.removeAttribute('inert');
        menuItems.forEach((el, idx)=>{
          el.style.transitionDelay = `calc(180ms + ${idx} * 70ms)`;
        });
      } else {
        mobileMenu.setAttribute('inert','');
        menuItems.forEach(el=>el.style.transitionDelay='');
      }
    }

    hamburger.addEventListener('click', toggleMenu);
    mobileMenu.addEventListener('click', (e)=>{
      if(e.target === mobileMenu) toggleMenu();
    });
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape' && hamburger.classList.contains('active')) toggleMenu();
    });
    const mq = window.matchMedia('(min-width:901px)');
    mq.addEventListener('change', ()=>{
      if(mq.matches && hamburger.classList.contains('active')) toggleMenu();
    });

    // 登录逻辑：随便输入就登录成功，跳转到原版 index.html
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    function doLogin(){
      localStorage.setItem("isLogin","true");
      window.location.href = "./index.html";
    }
    loginForm.addEventListener('submit',e=>{
      e.preventDefault();
      doLogin();
    });
    loginBtn.addEventListener('click',doLogin);
  </script>
</body>
</html>
